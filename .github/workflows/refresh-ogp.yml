name: Refresh OGP image

# 毎朝 7 時の X 予約投稿のカードに「その日の備蓄日数」を出すための、OGP だけの早朝再生成。
#
# fetch-daily.yml は 22:00 UTC (07:00 JST) 指定だが、GitHub の cron 遅延で実際は
# JST 09:10〜10:40 頃に走る（2026-09 下旬〜10 月の実績）。投稿時刻より後なので、
# 7 時の時点では前日の画像になってしまう。
# 画像の数字は snapshots.json と「いま」から計算するため（generate_ogp.compute_current_days）、
# JST 0 時を過ぎていれば PDF 取得を待たずに当日分の値で作れる。
# 本ワークフローは snapshots.json に触れず、og-image.png と生成 HTML(?v=ハッシュ) だけを更新する。
# 遅延（最大 3 時間超）を見込み、JST 03:23 を狙う（正時を避けて混雑も回避）。

on:
  schedule:
    - cron: '23 18 * * *'   # 18:23 UTC = 03:23 JST
  workflow_dispatch: {}

concurrency:
  group: fetch-daily        # fetch-daily.yml と同じ。push 競合を避けて直列化する
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install CJK fonts (for OGP image)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # fail-fast: 画像と HTML の ?v= は一組で動かすため、どちらか失敗したら何もコミットしない
      - name: Generate OGP image
        run: python scripts/generate_ogp.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit if changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          changed_paths=()
          if [[ -n "$(git status --porcelain assets/og-image.png)" ]]; then
            changed_paths+=("assets/og-image.png")
          fi
          while IFS= read -r html; do
            if [[ -n "$(git status --porcelain "$html")" ]]; then
              changed_paths+=("$html")
            fi
          done < <(python -c "import json;print('\n'.join(p['output'] for p in json.load(open('src/site.json', encoding='utf-8'))['pages']))")
          if [[ ${#changed_paths[@]} -eq 0 ]]; then
            echo "::notice::No changes; OGP already up to date"
            exit 0
          fi
          git add "${changed_paths[@]}"
          git commit -m "data: refresh OGP $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort 2>/dev/null || true
            fi
            if git push; then
              echo "::notice::pushed: ${changed_paths[*]}"
              exit 0
            fi
            echo "::warning::push failed on attempt ${attempt}; retrying on latest main"
            sleep 2
          done
          echo "::error::failed to push after retries"
          exit 1
